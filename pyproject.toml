[project]
name = "kid-extract"
version = "0.1.0"
description = "Structured extraction from European fund disclosure documents with a fine-tuned small language model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Naveen" }]

dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "peft>=0.12",
    "trl>=0.11",
    "datasets>=2.20",
    "accelerate>=0.33",
    "pandas>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.2", "pdfplumber>=0.11"]
plots = ["matplotlib>=3.8"]
hub = ["huggingface-hub>=0.24"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
kid-build = "kidextract.cli.build_dataset:main"
kid-train = "kidextract.cli.train:main"
kid-sweep = "kidextract.cli.sweep:main"
kid-eval = "kidextract.cli.evaluate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/kidextract/corpus/objectives.py" = ["E501"]
"src/kidextract/corpus/vocabulary.py" = ["E501"]
"src/kidextract/corpus/layouts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
